name: example-11
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MVN_USERNAME: ${{ secrets.MVN_USERNAME }}
      MVN_PASSWORD: ${{ secrets.MVN_PASSWORD }}
    steps:
      - name: Checkout of the project
        uses: actions/checkout@v5
      
      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn -s ./.m2/settings.xml -Denforcer.skip=true clean package
      
      - name: generate image
        run: docker build -t docker.io/actraiser/example-11:latest .

      - name: publish image
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker push docker.io/actraiser/example-11:latest
      